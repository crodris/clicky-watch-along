<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Same request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* Two screenshots of the same request, one per model, with each one's time and cost under it. */
  .pair { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  figure { margin: 0; }
  img { width: 100%; aspect-ratio: 788 / 492; display: block; border-radius: 10px; border: 1px solid var(--rule); }
  figcaption { margin-top: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .model { font-size: 28px; font-weight: 600; }
  .model small { display: block; font-size: 18px; font-weight: 400; color: var(--text-muted); margin-top: 2px; }
  .stats { font-size: 21px; color: var(--text-muted); text-align: right; white-space: nowrap; }
  .stats b { color: var(--text); font-weight: 600; }
  .judged { font-size: 18px; color: var(--text-muted); margin-top: 6px; }
  .pick { margin-left: 12px; font-size: 15px; font-weight: 600; color: #fff; background: var(--faster); padding: 3px 10px; border-radius: 999px; vertical-align: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><svg viewBox="0 0 30 30" aria-label="Clicky"><path d="M5 3 L26 15 L15 17 L10 27 Z" fill="#4d86ff"/></svg><span>My fork of open-source Clicky · model bakeoff, Nov 19</span></div>
  <h1 id="title"></h1>
  <div class="subhead" id="subhead"></div>
  <div class="pair" id="pair"></div>
  <div class="foot"><div id="footnote"></div></div>
</div>
<script>
  // One run of each pair, picked because both judges chose the same page in both A/B orders. Times and costs are that
  // run's, from bench/results/render2-* and sim3-*, at Ultrafast. Screenshots are in shots/, cropped from the judge's.
  const pairs = {
    heart: {
      title: 'Same heart request, two models',
      subhead: 'The learner said "show me the inside of a heart". Each picture is the view when the camera tour ends.',
      sides: [
        { model: 'GPT-6.1 Sol', note: 'what Clicky uses', shot: 'shots/heart-gpt61.jpg', seconds: 26.2, usd: 0.54 },
        { model: 'GPT-6.2 Astra', note: 'OpenAI', shot: 'shots/heart-astra.jpg', seconds: 21.6, usd: 1.11, winner: true },
      ],
      footnote: 'Both judges picked Astra’s heart in both orders, for its clearer chambers and valve cords. Clicky keeps GPT-6.1 Sol for 3D models, since Astra costs 2.5× as much.',
    },
    cannon: {
      title: 'Same cannon experiment, two models',
      subhead: 'The learner said "let me try it" over a cannon. Each picture is after one launch.',
      sides: [
        { model: 'GPT-6.1 Sol', note: 'built experiments until Nov 19', shot: 'shots/cannon-gpt61.jpg', seconds: 16.4, usd: 0.36 },
        { model: 'GPT-6.2 Astra', note: 'OpenAI', shot: 'shots/cannon-astra.jpg', seconds: 19.6, usd: 1.16, winner: true },
      ],
      footnote: 'Both judges picked Astra’s field for its visible cannon and full arc. GPT-6.1 Sol’s cannon is a speck seen from above.',
    },
    lever: {
      title: 'Same lever experiment, two models',
      subhead: 'The learner said "let me try it" over a lever. Each picture is after the Run button is pressed.',
      sides: [
        { model: 'GPT-6.1 Sol', note: 'its run never finished', shot: 'shots/lever-gpt61.jpg', seconds: 17.3, usd: 0.35 },
        { model: 'GPT-6.2 Sol', note: 'what Clicky now uses for experiments', shot: 'shots/lever-gpt62sol.jpg', seconds: 39.2, usd: 0.54, winner: true },
      ],
      footnote: 'GPT-6.2 Sol adds a ruler along the beam and an angle scale at the pivot. GPT-6.1 Sol’s run never ended, so the learner would get no result.',
    },
    pendulum: {
      title: 'Same pendulum experiment, two models',
      subhead: 'The learner said "let me try it" over a pendulum. Each picture is after the Run button is pressed.',
      sides: [
        { model: 'GPT-6.1 Sol', note: 'its run never finished', shot: 'shots/pendulum-gpt61.jpg', seconds: 16.0, usd: 0.33 },
        { model: 'GPT-6.2 Sol', note: 'what Clicky now uses for experiments', shot: 'shots/pendulum-gpt62sol.jpg', seconds: 38.1, usd: 0.59, winner: true },
      ],
      footnote: 'GPT-6.2 Sol adds a release angle scale and a stopwatch. Its extra 22 seconds pass while the video keeps playing.',
    },
  };
  const pair = pairs[new URLSearchParams(location.search).get('pair')] ?? pairs.heart;
  document.getElementById('title').textContent = pair.title;
  document.getElementById('subhead').textContent = pair.subhead;
  document.getElementById('footnote').textContent = pair.footnote;
  const pairElement = document.getElementById('pair');
  for (const side of pair.sides) {
    const figure = document.createElement('figure');
    figure.innerHTML = `<img src="${side.shot}" alt="${side.model}"><figcaption><div class="model">${side.model}${side.winner ? '<span class="pick">Judges\u2019 pick</span>' : ''}<small>${side.note}</small></div>`
      + `<div class="stats num"><b>${side.seconds.toFixed(1)} s</b> · <b>$${side.usd.toFixed(2)}</b></div></figcaption>`;
    pairElement.appendChild(figure);
  }
</script>
</body>
</html>
