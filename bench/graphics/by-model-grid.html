<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bakeoff grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* One row per call, one column per model, each cell the model's time or cost divided by today's model's. */
  .grid { margin-top: 26px; display: grid; grid-template-columns: 250px repeat(7, 1fr); gap: 6px; }
  .head { font-size: 19px; font-weight: 600; color: var(--text-muted); text-align: center; padding-bottom: 6px; line-height: 1.2; }
  .head small { display: block; font-weight: 400; font-size: 15px; }
  .call { font-size: 22px; font-weight: 600; display: flex; flex-direction: column; justify-content: center; line-height: 1.15; }
  .call small { font-size: 15px; font-weight: 400; color: var(--text-muted); margin-top: 3px; }
  .cell { height: 60px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 25px; font-weight: 600; position: relative; }
  .cell small { font-size: 14px; font-weight: 500; opacity: .85; margin-top: 1px; }
  .cell.today { outline: 2px dashed var(--today); outline-offset: -2px; }
  .cell.none { background: transparent; color: var(--text-muted); font-size: 16px; font-weight: 400; border: 1px solid var(--rule); }
  .fail { position: absolute; bottom: 4px; right: 7px; font-size: 13px; font-weight: 700; color: #ffd2cf; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><svg viewBox="0 0 30 30" aria-label="Clicky"><path d="M5 3 L26 15 L15 17 L10 27 Z" fill="#4d86ff"/></svg><span>My fork of open-source Clicky · model bakeoff, Nov 19</span></div>
  <h1 id="title"></h1>
  <div class="subhead" id="subhead"></div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <div id="footnote"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>
<script src="bakeoff-data.js"></script>
<script>
  const metric = new URLSearchParams(location.search).get('metric') === 'cost' ? 'cost' : 'time';
  const { routes, taskAgent } = window.bakeoff;
  const columns = [
    { side: 'haiku', name: 'Haiku 5.5', lab: 'Anthropic' },
    { side: 'sonnet', name: 'Sonnet 5.5', lab: 'Anthropic' },
    { side: 'opus', name: 'Opus 5.5', lab: 'Anthropic' },
    { side: 'fable', name: 'Fable 5.2', lab: 'Anthropic' },
    { side: 'sol62', name: 'GPT-6.2 Sol', lab: 'OpenAI, Ultrafast' },
    { side: 'astra', name: 'GPT-6.2 Astra', lab: 'OpenAI, Ultrafast' },
    { side: 'neon', name: 'Gemini 4 Neon', lab: 'Google' },
  ];
  // The model each call used during the bakeoff, which every cell is divided by.
  const todaySide = { quiz: 'sonnet', flows: 'opus', judge: 'sonnet', voice: 'haiku', landmark: 'sonnet', parts: 'sonnet', chat: 'sonnet', agent: 'sonnet' };
  const todayName = { sonnet: 'Sonnet 5.5', opus: 'Opus 5.5', haiku: 'Haiku 5.5' };

  const timeOf = (stats) => stats.firstTokenP50Ms ?? stats.p50Ms;
  const valueOf = (stats) => (metric === 'cost' ? stats.costPerCallUSD : timeOf(stats));

  const rows = routes.map((route) => ({
    key: route.key, name: route.name,
    note: route.key === 'chat' ? 'to the first word' : '',
    cells: Object.fromEntries(columns.map(({ side }) => {
      if (side === 'neon') {
        return [side, { stats: route.neon.neon, base: route.neon.base }];
      }
      return [side, { stats: route.sides[side], base: route.sides.base }];
    })),
  }));
  rows.push({
    key: 'agent', name: 'Task agent', note: '',
    cells: Object.fromEntries(columns.map(({ side }) => [side, taskAgent[side] ? { stats: taskAgent[side], base: taskAgent.base } : null])),
  });

  // Seven steps from much better (blue) through no change (gray) to much worse (red), on a log scale of the ratio.
  const steps = metric === 'cost'
    ? [{ upTo: 1 / 4, fill: '#2f6fd6' }, { upTo: 1 / 1.6, fill: '#2a5596' }, { upTo: 1 / 1.15, fill: '#263e63' }, { upTo: 1.15, fill: '#1d2433' }, { upTo: 1.6, fill: '#4d2a31' }, { upTo: 4, fill: '#7d3036' }, { upTo: Infinity, fill: '#b5393d' }]
    : [{ upTo: 0.5, fill: '#2f6fd6' }, { upTo: 0.75, fill: '#2a5596' }, { upTo: 0.9, fill: '#263e63' }, { upTo: 1.1, fill: '#1d2433' }, { upTo: 1.5, fill: '#4d2a31' }, { upTo: 3, fill: '#7d3036' }, { upTo: Infinity, fill: '#b5393d' }];
  const fillFor = (ratio) => steps.find((step) => ratio <= step.upTo).fill;
  const ratioText = (ratio) => (ratio >= 10 ? `${Math.round(ratio)}×` : ratio >= 1 ? `${ratio.toFixed(1)}×` : `${ratio.toFixed(2)}×`);
  const absoluteText = (stats) => (metric === 'cost'
    ? (stats.costPerCallUSD < 0.001 ? '<$0.001' : `$${stats.costPerCallUSD.toFixed(stats.costPerCallUSD < 0.01 ? 4 : 3)}`)
    : `${(timeOf(stats) / 1000).toFixed(1)} s`);

  document.getElementById('title').textContent = metric === 'cost' ? 'Cost per call, compared with the model each call used' : 'Time per call, compared with the model each call used';
  document.getElementById('subhead').textContent = metric === 'cost'
    ? 'Mean cost per call divided by the current model’s. Below 1× is cheaper.'
    : 'Median time divided by the current model’s. Below 1× is faster.';
  document.getElementById('footnote').innerHTML = metric === 'cost'
    ? '<b>Dashed cell</b> = the model the call used, run again as a check.<br>GPT models at Ultrafast, which costs 6× standard. 139 calls per model.'
    : '<b>Dashed cell</b> = the model the call used, run again as a check. <b>✕</b> = failed checks.<br>Neon ran on its own day slot, so its ratios use that run’s own baseline.';

  const grid = document.getElementById('grid');
  grid.appendChild(Object.assign(document.createElement('div'), { className: 'head' }));
  for (const column of columns) {
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = `${column.name}<small>${column.lab}</small>`;
    grid.appendChild(head);
  }
  for (const row of rows) {
    const call = document.createElement('div');
    call.className = 'call';
    call.innerHTML = `${row.name}<small>${row.note === '' ? '' : `${row.note} · `}vs ${todayName[todaySide[row.key]]}</small>`;
    grid.appendChild(call);
    for (const column of columns) {
      const cell = document.createElement('div');
      const entry = row.cells[column.side];
      if (entry === null || entry === undefined) {
        cell.className = 'cell none';
        cell.textContent = column.side === 'neon' || column.side.startsWith('sol') || column.side === 'astra' ? 'cannot run it' : '';
        grid.appendChild(cell);
        continue;
      }
      const ratio = valueOf(entry.stats) / valueOf(entry.base);
      cell.className = `cell num${column.side === todaySide[row.key] ? ' today' : ''}`;
      cell.style.background = fillFor(ratio);
      cell.innerHTML = `${ratioText(ratio)}<small>${absoluteText(entry.stats)}</small>`;
      if (entry.stats.passed < entry.stats.runs) {
        const fail = document.createElement('span');
        fail.className = 'fail';
        fail.textContent = `✕ ${entry.stats.runs - entry.stats.passed}/${entry.stats.runs}`;
        cell.appendChild(fail);
      }
      grid.appendChild(cell);
    }
  }
  const legend = document.getElementById('legend');
  const legendLabels = metric === 'cost' ? ['¼× or less', '', '', 'about the same', '', '', '4× or more'] : ['half or less', '', '', 'about the same', '', '', '3× or more'];
  steps.forEach((step, index) => {
    const item = document.createElement('span');
    item.innerHTML = `<i style="background:${step.fill}"></i>${legendLabels[index]}`;
    legend.appendChild(item);
  });
</script>
</body>
</html>
