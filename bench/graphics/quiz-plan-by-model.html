<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quiz plan by model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* One bar per model: the median time to plan a quiz, a tick at p95, and what each plan cost. */
  .chart { margin-top: 34px; display: grid; grid-template-columns: 250px 1fr 220px; row-gap: 22px; column-gap: 24px; align-items: center; }
  .label { font-size: 25px; font-weight: 600; line-height: 1.1; }
  .label small { display: block; font-size: 16px; font-weight: 400; color: var(--text-muted); margin-top: 3px; }
  .track { position: relative; height: 46px; }
  .bar { position: absolute; left: 0; top: 7px; height: 32px; border-radius: 0 4px 4px 0; background: var(--today); }
  .bar.pick { background: var(--faster); }
  .value { position: absolute; top: 9px; font-size: 22px; font-weight: 600; white-space: nowrap; }
  .value small { font-size: 16px; color: var(--text-muted); font-weight: 400; }
  .side { font-size: 20px; color: var(--text-muted); line-height: 1.25; }
  .side b { color: var(--text); font-weight: 600; }
  .off { position: absolute; right: 0; top: 7px; height: 32px; display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 600; color: var(--slower); }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><svg viewBox="0 0 30 30" aria-label="Clicky"><path d="M5 3 L26 15 L15 17 L10 27 Z" fill="#4d86ff"/></svg><span>My fork of open-source Clicky · model bakeoff, Nov 19</span></div>
  <h1>Time to plan a video quiz, by model</h1>
  <div class="subhead">Median of 6 plans, a 3.5-minute and a 10-minute video. Each row also gives the slowest plan.</div>
  <div class="chart" id="chart"></div>
  <div class="foot">
    <div><b>GPT-6.2 Sol</b> now plans every quiz. Astra was faster but cost 5.9× as much and lost the blind judge 1-2.</div>
  </div>
</div>
<script src="bakeoff-data.js"></script>
<script>
  const quiz = window.bakeoff.routes.find((route) => route.key === 'quiz');
  const models = [
    { name: 'GPT-6.2 Astra', lab: 'OpenAI, Ultrafast', stats: quiz.sides.astra },
    { name: 'GPT-6.2 Sol', lab: 'OpenAI, Ultrafast', stats: quiz.sides.sol62, pick: true },
    { name: 'Haiku 5.5', lab: 'Anthropic', stats: quiz.sides.haiku },
    { name: 'Opus 5.5', lab: 'Anthropic', stats: quiz.sides.opus },
    { name: 'Sonnet 5.5', lab: 'Anthropic, used before', stats: quiz.sides.base },
    { name: 'Fable 5.2', lab: 'Anthropic', stats: quiz.sides.fable },
    { name: 'Gemini 4 Neon', lab: 'Google', stats: quiz.neon.neon },
  ];
  // The axis stops at 30 seconds, so Neon's bar runs off it and says so in words.
  const axisMs = 30000;
  const chart = document.getElementById('chart');
  for (const model of models) {
    const label = document.createElement('div');
    label.className = 'label';
    label.innerHTML = `${model.name}<small>${model.lab}</small>`;
    const track = document.createElement('div');
    track.className = 'track';
    const share = (ms) => `${Math.min(100, (ms / axisMs) * 100)}%`;
    if (model.stats.p50Ms > axisMs) {
      track.innerHTML = `<div class="bar" style="width:100%;background:#4d2a31"></div><div class="off">${(model.stats.p50Ms / 1000).toFixed(0)} s median, past the 30 s edge</div>`;
    } else {
      track.innerHTML = `<div class="bar${model.pick ? ' pick' : ''}" style="width:${share(model.stats.p50Ms)}"></div>`
        + `<div class="value num" style="left:calc(${share(model.stats.p50Ms)} + 12px)">${(model.stats.p50Ms / 1000).toFixed(1)} s`
        + `<small> · slowest ${(model.stats.p95Ms / 1000).toFixed(0)} s</small></div>`;
    }
    const side = document.createElement('div');
    side.className = 'side num';
    const failed = model.stats.runs - model.stats.passed;
    side.innerHTML = `<b>$${model.stats.costPerCallUSD.toFixed(3)}</b> a plan<br>${failed === 0 ? 'passed all 6' : `failed ${failed} of 6`}`;
    chart.append(label, track, side);
  }
</script>
</body>
</html>
