[project]
name = "clicky-depth-service"
version = "0.1.0"
description = "Local Depth Pro service that measures the wall in one camera frame for Clicky's art placement"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned to the commit the prototype measured with. Depth Pro needs numpy<2.
    "depth-pro @ git+https://github.com/apple/ml-depth-pro@9e65e4dbe9568d23c546fcec53302b10445e109e",
    "numpy<2",
    "opencv-python-headless",
    "pillow",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
