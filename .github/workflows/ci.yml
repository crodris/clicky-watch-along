name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Match the Xcode Chris builds with locally, so a newer runner default cannot break the build unnoticed.
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: >
          xcodebuild build
          -project leanring-buddy.xcodeproj
          -scheme leanring-buddy
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
