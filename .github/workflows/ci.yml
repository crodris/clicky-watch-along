name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Each push to main gets its own group, since GitHub keeps one
# pending run per group and cancels the one before it, and the changes job of a push diffs only against the commit
# before that push, so a cancelled run's app changes would never be tested.
concurrency:
  group: ${{ github.event_name == 'push' && format('ci-push-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck

  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: harness/go.mod
          cache-dependency-path: harness/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: bench/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: bench/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      # The committed results must still parse, since the charts are built from them.
      - run: node report.ts --out "$RUNNER_TEMP/bench-report" results/*.json
      # verify-clicky's build checks that the app is newer than every Swift file under leanring-buddy/, and this test pins that check.
      - run: bash ../.claude/skills/verify-clicky/verify-clicky.test.sh
      # Every PNG the AppIcon set names must have its exact size and transparent corners, or macOS shows a black square behind the icon.
      - run: python3 -I ../tools/app-icon/check-app-icon.py

  # Says whether a pull request or a push to main changes anything the app build or its tests read, so a bench,
  # worker, or docs change does not wait in line for a Mac runner.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_job_needed: ${{ steps.app_job_needed.outputs.app_job_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit, whose first parent is the base it merges into.
          fetch-depth: 2
      - run: bash tools/app-job-needed.test.sh
      - id: app_job_needed
        env:
          COMMIT_BEFORE_THE_PUSH: ${{ github.event.before }}
        run: |
          # The default shell has no pipefail, and without it a failed git diff would hand the script an empty list.
          set -o pipefail
          compared_commit="HEAD^1"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            compared_commit="$COMMIT_BEFORE_THE_PUSH"
            # A push that rewrote main can name a commit the remote no longer has, and then the app job runs.
            if ! git fetch --no-tags --depth=1 origin "$compared_commit"; then
              echo "app_job_needed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # --no-renames lists a moved file at its old path too, since moving a file out of the app changes the app.
          app_job_needed="$(git diff --name-only --no-renames "$compared_commit" HEAD | bash tools/app-job-needed.sh)"
          case "$app_job_needed" in
            true | false) ;;
            *)
              echo "tools/app-job-needed.sh printed '$app_job_needed' instead of true or false." >&2
              exit 1
              ;;
          esac
          echo "app_job_needed=$app_job_needed" >> "$GITHUB_OUTPUT"

  app:
    needs: changes
    if: needs.changes.outputs.app_job_needed == 'true'
    # Pushes and same-repo PRs run on the self-hosted Mac runners, as a separate macOS user, because GitHub's macOS queue can take over 10 minutes.
    # Fork PRs stay on GitHub's runner, and the repo requires approval before an outside contributor's workflow runs, since a fork can edit this line.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'clicky-mac' || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app's Build Agent Harness phase runs tools/build-agent-harness.sh, which needs Go. It looks on PATH first, so this
      # one is used on both runners, and the Mac runner needs no Go of its own.
      # The Mac runners keep Go's build and module caches in the runner user's home between jobs, so the Actions cache is off
      # there: restoring its 471 MB archive took up to a minute, and saving it took 2 to 9 minutes a job and then failed.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: harness/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: harness/go.sum
      # Match the Xcode used for local builds, so a newer runner default cannot break the build unnoticed.
      - if: runner.environment == 'github-hosted'
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      # The Mac runner uses the Mac's only Xcode, so an App Store update fails here instead of changing the build.
      - if: runner.environment == 'self-hosted'
        run: xcodebuild -version | grep -qx 'Xcode 26.5'
      # CLICKY_BUNDLE_ID_SUFFIX gives the unsigned CI app its own bundle ID. macOS keeps one Accessibility grant per bundle
      # ID for the whole Mac, so a test host under the developer's ID reset the developer's grant on 2026-11-20.
      # The suffix names the runner, so test hosts that run at the same time on the Mac's runners never share an app's defaults.
      # Each Mac runner keeps its own DerivedData between jobs, so Xcode compiles only what a change touches instead of all
      # of the app and its tests, which took about 4 minutes of every job. The folder is named after the runner, since one
      # runner runs one job at a time, and after the Xcode build, so an Xcode update starts from scratch.
      # GitHub's runner for fork pull requests starts empty anyway, so it builds in the job's temp folder.
      # Later jobs trust what earlier jobs left in the kept folder, so only refs with write access may reach these runners.
      - run: |
          # Three Mac runners build at once on one 32 GB Mac, and with Xcode's default of one compile job per core the Mac
          # swapped about 37 GB on 2026-11-21 and a 2 minute build took 10. Four jobs each keeps the three builds in memory.
          echo "CLICKY_BUILD_JOBS=4" >> "$GITHUB_ENV"
          runner_name_for_ids="$(printf '%s' "$RUNNER_NAME" | tr -c 'A-Za-z0-9' '-')"
          # An empty name would make the runner's folder the shared parent, and the prune below would reach other runners.
          if [ -z "$runner_name_for_ids" ]; then
            echo "RUNNER_NAME is empty, so the runner's bundle ID and DerivedData folder have no name." >&2
            exit 1
          fi
          echo "CLICKY_BUNDLE_ID_SUFFIX=.ci-$runner_name_for_ids" >> "$GITHUB_ENV"
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            xcode_build_version="$(xcodebuild -version | awk '/Build version/ { print $3 }')"
            if [ -z "$xcode_build_version" ]; then
              echo "xcodebuild -version printed no build version, so the kept DerivedData folder has no name." >&2
              exit 1
            fi
            # Each runner has a folder of its own, so pruning one runner's folders never reaches another runner's build.
            runner_derived_data_folder="$HOME/Library/Caches/clicky-ci-derived-data/$runner_name_for_ids"
            # A folder this runner kept under an earlier Xcode build is never used again.
            find "$runner_derived_data_folder" -mindepth 1 -maxdepth 1 ! -name "$xcode_build_version" -exec rm -rf {} + 2>/dev/null || true
            echo "CLICKY_DERIVED_DATA=$runner_derived_data_folder/$xcode_build_version" >> "$GITHUB_ENV"
          else
            echo "CLICKY_DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          fi
      - id: xcode_build
        run: >
          xcodebuild build
          -project leanring-buddy.xcodeproj
          -scheme leanring-buddy
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$CLICKY_DERIVED_DATA"
          -jobs "$CLICKY_BUILD_JOBS"
          CODE_SIGNING_ALLOWED=NO
          CLICKY_BUNDLE_ID_SUFFIX="$CLICKY_BUNDLE_ID_SUFFIX"
      # The result bundle goes to the job's temp folder, since xcodebuild otherwise adds one to the kept DerivedData every run.
      - id: xcode_test
        run: >
          xcodebuild test
          -project leanring-buddy.xcodeproj
          -scheme leanring-buddy
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$CLICKY_DERIVED_DATA"
          -jobs "$CLICKY_BUILD_JOBS"
          -only-testing:leanring-buddyTests
          -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"
          CODE_SIGNING_ALLOWED=NO
          CLICKY_BUNDLE_ID_SUFFIX="$CLICKY_BUNDLE_ID_SUFFIX"
      # An xcodebuild step cancelled mid-build, by a newer push or the job's timeout, can leave the kept folder half written,
      # and every later job on this runner would then fail, so the next job on this runner builds from scratch instead.
      # A compile error or a failing test leaves the folder whole, and Xcode builds on from it, so those keep it.
      - if: >-
          always() && runner.environment == 'self-hosted'
          && (steps.xcode_build.outcome == 'cancelled' || steps.xcode_test.outcome == 'cancelled')
        run: |
          if [ -n "$CLICKY_DERIVED_DATA" ]; then
            rm -rf "$CLICKY_DERIVED_DATA"
          fi
