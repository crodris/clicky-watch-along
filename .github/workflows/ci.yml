name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run, and every push to main finishes so each main commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: bench/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: bench/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The committed results must still parse, since the charts are built from them.
      - run: node report.ts --out "$RUNNER_TEMP/bench-report" results/*.json

  app:
    # Pushes and same-repo PRs run on the self-hosted runner on Chris's Mac, as the clicky-ci user, because GitHub's macOS queue can take over 10 minutes.
    # Fork PRs stay on GitHub's runner, and the repo requires approval before an outside contributor's workflow runs, since a fork can edit this line.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'clicky-mac' || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Match the Xcode Chris builds with locally, so a newer runner default cannot break the build unnoticed. The Mac runner already uses that Xcode.
      - if: runner.environment == 'github-hosted'
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - run: >
          xcodebuild build
          -project leanring-buddy.xcodeproj
          -scheme leanring-buddy
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
      - run: >
          xcodebuild test
          -project leanring-buddy.xcodeproj
          -scheme leanring-buddy
          -configuration Debug
          -destination 'platform=macOS'
          -only-testing:leanring-buddyTests
          CODE_SIGNING_ALLOWED=NO
