<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  /* Mirrors DS.Colors.overlayCursorBlue, the blue of Clicky's cursor. */
  --clicky-blue: #3380ff;
  /* Mirrors DS.Colors.success. */
  --clicky-success-green: #34d399;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: -apple-system, sans-serif; }
canvas { display: block; position: absolute; inset: 0; }
#backdrop { position: absolute; inset: 0; background: rgb(0, 0, 0); opacity: 0; }
#frameBackground { position: absolute; }
svg#leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.scene-label { position: absolute; left: 0; top: 0; padding: 5px 10px; border-radius: 8px; background: rgba(250, 246, 240, 0.96); color: #222; font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); pointer-events: none; transition: background-color 0.3s, color 0.3s, opacity 0.3s; }
.scene-label.focused { background: #ffe066; }
.scene-label.quiz-answer { z-index: 2; }
/* The "?" waiting to be named is larger and Clicky blue. The class comes off when the name shows. */
.scene-label.quiz-answer.unanswered { background: var(--clicky-blue); color: #fff; font-size: 22px; padding: 7px 16px; border-radius: 11px; }
.scene-label.quiz-answer.answered-correctly { background: var(--clicky-success-green); color: #04291b; }
/* translate is its own property, so the shake does not fight the transform that places the label. */
.scene-label.shaking { animation: label-shake 0.45s ease-in-out 1; }
@keyframes label-shake { 0%, 100% { translate: 0 0; } 20% { translate: -9px 0; } 40% { translate: 8px 0; } 60% { translate: -6px 0; } 80% { translate: 4px 0; } }
.answer-burst { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; box-sizing: border-box; border: 3px solid var(--clicky-success-green); border-radius: 50%; pointer-events: none; opacity: 0; animation: answer-burst 0.7s ease-out 1 forwards; }
@keyframes answer-burst { from { transform: scale(0.2); opacity: 0.95; } to { transform: scale(2.6); opacity: 0; } }
/* The return fades labels by hand each frame, so the label's own fade must not lag behind it. */
body.returning .scene-label { transition: none; }
/* Labels catch the mouse only once a pop-out with no quiz has finished its tour, so before that every press turns the model. */
body.labels-take-clicks .scene-label { pointer-events: auto; cursor: pointer; -webkit-user-select: none; user-select: none; transition: background-color 0.3s, opacity 0.3s, box-shadow 0.15s; }
body.labels-take-clicks .scene-label:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), 0 0 0 2px rgba(255, 224, 102, 0.9); }
</style>
<script type="importmap">{ "imports": { "three": "clicky-asset://three/three.module.js" } }</script>
</head>
<body>
<div id="backdrop"></div>
<canvas id="frameBackground"></canvas>
<svg id="leaders"></svg>
<script>/*CLICKY_FRAME_POPOUT_DATA*/</script>
<script type="module">
const popout = window.__framePopout;
const labelEntries = [];
let focusedEntry = null;
let tourDone = false;
let cameraDistance = 0;
// After the tour the camera eases toward this distance, so a voice zoom glides instead of jumping.
let restingCameraDistance = 0;
let tourEndedEarlyAt = null;
const reducedMotionQuery = matchMedia("(prefers-reduced-motion: reduce)");
let minimumDistance = 0;
let maximumDistance = 0;
let yaw = 0;
let pitch = 0;
let focusMove = null;
let sceneIsBuilt = false;
// Set when the return starts. returnFrom holds the pose it eases back from.
let returnStartedAt = null;
let returnFrom = null;
let returnFinishedPosted = false;
let labelFade = 1;
const returnSeconds = 0.8;

const postLiveSceneEvent = (eventName) => window.webkit?.messageHandlers?.liveSceneEvent?.postMessage(eventName);

// outcome is celebrateCorrectName, shakeAndKeepTheQuestionMark, or revealWithoutCelebration.
// The shake and the ring burst are skipped for a viewer who asked for reduced motion, and the color flip stays.
function showAnswerMoment(outcome) {
  const entry = labelEntries.find((candidate) => candidate.part.isQuizAnswer);
  if (!entry) return;
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (outcome === "shakeAndKeepTheQuestionMark") {
    if (reducedMotion) return;
    entry.element.classList.remove("shaking");
    void entry.element.offsetWidth;
    entry.element.classList.add("shaking");
    return;
  }
  entry.element.textContent = entry.part.label;
  entry.element.classList.remove("unanswered");
  if (outcome !== "celebrateCorrectName") return;
  entry.element.classList.add("answered-correctly");
  if (reducedMotion || entry.anchorX === undefined) return;
  for (const delaySeconds of [0, 0.12]) {
    const burst = document.createElement("div");
    burst.className = "answer-burst";
    burst.style.left = `${entry.anchorX}px`;
    burst.style.top = `${entry.anchorY}px`;
    burst.style.animationDelay = `${delaySeconds}s`;
    burst.addEventListener("animationend", () => burst.remove(), { once: true });
    document.body.appendChild(burst);
  }
}

window.liveScene = {
  reveal() {
    showAnswerMoment("revealWithoutCelebration");
  },
  answerMoment: showAnswerMoment,
  // Labels fade, the camera eases back to its starting pose, and the lifted subject flattens
  // into the frame over the video. The page posts returnFinished when it has landed.
  returnToSource() {
    if (returnStartedAt !== null) return;
    returnStartedAt = performance.now();
    // A label clicked while the subject sinks back would start an explanation for a scene that is leaving.
    document.body.classList.remove("labels-take-clicks");
    if (!sceneIsBuilt) {
      // Nothing is lifted yet, so there is nothing to put back.
      returnFinishedPosted = true;
      postLiveSceneEvent("returnFinished");
      return;
    }
    returnFrom = { lift: liftNow, yaw, pitch, cameraDistance, target: target.clone() };
    for (const entry of labelEntries) entry.opacityAtReturn = parseFloat(entry.element.style.opacity) || 0;
    document.body.classList.add("returning");
  },
  focusPart(labelText) {

      for (const entry of labelEntries) { entry.element.classList.remove("focused"); entry.element.style.opacity = ""; }
      return true;
    }
    const entry = labelEntries.find((candidate) => candidate.part.label.toLowerCase() === wanted);
    if (!entry) return false;
    focusedEntry = entry;
    for (const other of labelEntries) {
      other.element.classList.toggle("focused", other === entry);
      other.element.style.opacity = other === entry ? "1" : "0.35";
    }

    return true;
  },
  zoomBy(amount) {
    if (!tourDone) return;

    if (reducedMotionQuery.matches) cameraDistance = restingCameraDistance;
  },
  // Positive yaw moves the camera right around the subject, positive pitch moves it up, like a drag does.
  rotateBy(yawDegrees, pitchDegrees) {
    if (!sceneIsBuilt || returnStartedAt !== null) return;
    window.liveScene.endTour();
    draggedYaw += THREE.MathUtils.degToRad(yawDegrees);
    draggedPitch = Math.min(1.1, Math.max(-1.1, draggedPitch + THREE.MathUtils.degToRad(pitchDegrees)));
    if (reducedMotionQuery.matches) { yaw = draggedYaw; pitch = draggedPitch; }
  },
  // A voice command during the tour stops it where it is, and the camera glides to the subject from there.
  endTour() {
    if (!sceneIsBuilt || tourDone || returnStartedAt !== null) return;
    tourEndedEarlyAt = performance.now();
    focusMove = { startedAt: performance.now(), from: null };
    finishTour();
  },
  resetView() {
    if (!sceneIsBuilt || returnStartedAt !== null) return;
    window.liveScene.endTour();
    window.liveScene.focusPart("");
    draggedYaw = 0.6;
    draggedPitch = 0.18;
    restingCameraDistance = endDistance;
    focusMove = { startedAt: performance.now(), from: null };
    if (reducedMotionQuery.matches) { yaw = draggedYaw; pitch = draggedPitch; cameraDistance = restingCameraDistance; }
  },
  getState() {
    const zoomRange = maximumDistance - minimumDistance;
    // During the tour the camera is still moving, so the pose it has right now is the truth.
    const shownDistance = tourDone ? restingCameraDistance : cameraDistance;
    return {
      yawDegrees: Math.round(THREE.MathUtils.radToDeg(tourDone ? draggedYaw : yaw)),
      pitchDegrees: Math.round(THREE.MathUtils.radToDeg(tourDone ? draggedPitch : pitch)),
      zoom: zoomRange > 0 ? Math.round(Math.min(1, Math.max(0, (maximumDistance - shownDistance) / zoomRange)) * 100) / 100 : 0,
      // The label's own text, so a quiz answer still reads "?".
      focusedLabel: focusedEntry ? focusedEntry.element.textContent : "",
      tourFinished: tourDone,
    };
  },
  // Clicky's blue cursor points at a label, so the boxes are read only once the camera stops gliding.
  // A subject sinking back has nothing to point at, and its window may hide, which stops animation frames, so this waits on timers.
  async labelRectsOnceTheCameraSettles() {
    const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
    const giveUpAt = performance.now() + 3000;
    while (focusMove && returnStartedAt === null && performance.now() < giveUpAt) await wait(50);
    // After the camera stops, each label's offset still eases toward its new spot for a few hundred milliseconds.
    await wait(400);
    if (returnStartedAt !== null) return [];
    return labelEntries.map((entry) => {
      const rect = entry.element.getBoundingClientRect();
      return { label: entry.part.label, left: rect.left, top: rect.top, width: rect.width, height: rect.height };
    });
  },
};

import * as THREE from "three";

const image = await new Promise((resolve, reject) => {
  const frameImage = new Image();
  frameImage.onload = () => resolve(frameImage);
  frameImage.onerror = () => reject(new Error("frame image failed to load"));
  frameImage.src = popout.frameDataURL;
});
const W = image.naturalWidth, H = image.naturalHeight;

const pageWidth = innerWidth, pageHeight = innerHeight;
let frameRect = popout.videoRect;
const rectIsOnThisPage = frameRect && frameRect.width > 50 && frameRect.x > -frameRect.width / 2 && frameRect.y > -frameRect.height / 2
  && frameRect.x + frameRect.width / 2 < pageWidth && frameRect.y + frameRect.height / 2 < pageHeight;
if (!rectIsOnThisPage) {
  const width = pageWidth * 0.6;
  frameRect = { x: (pageWidth - width) / 2, y: (pageHeight - width * H / W) / 2, width, height: width * H / W };
}
// The video element can letterbox, so fit the frame inside its rect.
const fitScale = Math.min(frameRect.width / W, frameRect.height / H);
const shownWidth = W * fitScale, shownHeight = H * fitScale;
const shownLeft = frameRect.x + (frameRect.width - shownWidth) / 2, shownTop = frameRect.y + (frameRect.height - shownHeight) / 2;
const frameToWorld = fitScale;
const frameCenterWorld = new THREE.Vector3(shownLeft + shownWidth / 2 - pageWidth / 2, pageHeight / 2 - (shownTop + shownHeight / 2), 0);
const framePointToWorld = (frameX, frameY, z) => new THREE.Vector3(
  frameCenterWorld.x + (frameX - W / 2) * frameToWorld,
  frameCenterWorld.y + (H / 2 - frameY) * frameToWorld,
  z,
);

const full = document.createElement("canvas"); full.width = W; full.height = H;
const fullContext = full.getContext("2d", { willReadFrequently: true }); fullContext.drawImage(image, 0, 0);
const pixels = fullContext.getImageData(0, 0, W, H).data;

const pad = 12;
const box = popout.subjectBox;
const x0 = Math.max(0, box.left - pad), y0 = Math.max(0, box.top - pad);
const x1 = Math.min(W - 1, box.right + pad), y1 = Math.min(H - 1, box.bottom + pad);
const boxW = x1 - x0 + 1, boxH = y1 - y0 + 1;

// The app's subject mask is white where the subject is. It comes from Apple's subject lifting, or from Sonnet's box for a painted scene.
const maskImage = await new Promise((resolve, reject) => {
  const loadedMask = new Image();
  loadedMask.onload = () => resolve(loadedMask);
  loadedMask.onerror = () => reject(new Error("subject mask failed to load"));
  loadedMask.src = popout.maskDataURL;
});
const maskCanvas = document.createElement("canvas"); maskCanvas.width = W; maskCanvas.height = H;
const maskContext = maskCanvas.getContext("2d", { willReadFrequently: true }); maskContext.drawImage(maskImage, 0, 0, W, H);
const maskPixels = maskContext.getImageData(x0, y0, boxW, boxH).data;
const subjectMask = new Uint8Array(boxW * boxH);
for (let i = 0; i < subjectMask.length; i++) subjectMask[i] = maskPixels[i * 4] > 127 ? 1 : 0;

// Vision can leave out a part drawn in a color close to the background, like the pale blue
// inferior vena cava below the heart, keeping only its outline. A labeled part belongs to the
// subject, so a label point outside the mask grows into the patch of similar color around it.
// The size cap keeps a point Sonnet placed on the background from pulling the background in.
{
  const largestPatch = boxW * boxH * 0.03;
  const colorDistanceAt = (i, seedIndex) => {
    const a = (((i / boxW) | 0) + y0) * W * 4 + ((i % boxW) + x0) * 4;
    const b = (((seedIndex / boxW) | 0) + y0) * W * 4 + ((seedIndex % boxW) + x0) * 4;
    return Math.hypot(pixels[a] - pixels[b], pixels[a + 1] - pixels[b + 1], pixels[a + 2] - pixels[b + 2]);
  };
  for (const part of popout.parts) {
    const seedX = Math.round(part.x) - x0, seedY = Math.round(part.y) - y0;
    if (seedX < 0 || seedY < 0 || seedX >= boxW || seedY >= boxH) continue;
    const seed = seedY * boxW + seedX;
    if (subjectMask[seed]) continue;
    const patch = [seed], inPatch = new Uint8Array(boxW * boxH);
    inPatch[seed] = 1;
    for (let next = 0; next < patch.length && patch.length <= largestPatch; next++) {
      const i = patch[next], x = i % boxW, y = (i / boxW) | 0;
      for (const neighbor of [x > 0 ? i - 1 : -1, x < boxW - 1 ? i + 1 : -1, y > 0 ? i - boxW : -1, y < boxH - 1 ? i + boxW : -1]) {
        if (neighbor < 0 || inPatch[neighbor] || subjectMask[neighbor] || colorDistanceAt(neighbor, seed) > 48) continue;
        inPatch[neighbor] = 1; patch.push(neighbor);
      }

    if (patch.length <= largestPatch) for (const i of patch) subjectMask[i] = 1;
  }
}

// Pinholes in the mask become dents in the model, so small enclosed gaps are filled.
// Large ones, like the inside of a loop, are real background and stay open.
{
  const visited = new Uint8Array(boxW * boxH);
  const largestHoleToFill = boxW * boxH * 0.02;
  for (let seed = 0; seed < subjectMask.length; seed++) {
    if (subjectMask[seed] || visited[seed]) continue;
    const region = [];
    let touchesTheEdge = false;
    const stack = [seed];
    visited[seed] = 1;
    while (stack.length) {
      const i = stack.pop();
      region.push(i);
      const x = i % boxW, y = (i / boxW) | 0;
      if (x === 0 || y === 0 || x === boxW - 1 || y === boxH - 1) touchesTheEdge = true;
      for (const neighbor of [x > 0 ? i - 1 : -1, x < boxW - 1 ? i + 1 : -1, y > 0 ? i - boxW : -1, y < boxH - 1 ? i + boxW : -1]) {
        if (neighbor >= 0 && !visited[neighbor] && !subjectMask[neighbor]) { visited[neighbor] = 1; stack.push(neighbor); }
      }
    }
    if (!touchesTheEdge && region.length < largestHoleToFill) for (const i of region) subjectMask[i] = 1;
  }
}


const distance = new Float32Array(boxW * boxH);
for (let i = 0; i < distance.length; i++) distance[i] = subjectMask[i] ? 1e6 : 0;
const relax = (i, j, cost) => { if (distance[j] + cost < distance[i]) distance[i] = distance[j] + cost; };
const onBoxEdge = (x, y) => x === 0 || y === 0 || x === boxW - 1 || y === boxH - 1;
for (let y = 0; y < boxH; y++) for (let x = 0; x < boxW; x++) {
  const i = y * boxW + x; if (!subjectMask[i]) continue;
  if (onBoxEdge(x, y)) { distance[i] = 1; continue; }
  relax(i, i - 1, 1); relax(i, i - boxW, 1); relax(i, i - boxW - 1, 1.414); relax(i, i - boxW + 1, 1.414);
}
for (let y = boxH - 1; y >= 0; y--) for (let x = boxW - 1; x >= 0; x--) {
  const i = y * boxW + x; if (!subjectMask[i] || onBoxEdge(x, y)) continue;
  relax(i, i + 1, 1); relax(i, i + boxW, 1); relax(i, i + boxW + 1, 1.414); relax(i, i + boxW - 1, 1.414);
}
let maximumInsideDistance = 1;
for (const value of distance) if (value > maximumInsideDistance) maximumInsideDistance = value;

const rimRadius = 22;
const thicknessInFramePixels = (d) => {
  if (d <= 0) return 0;
  // A picture that already shows depth, like a cutaway or a photo of a machine, has its perspective
  // and shading drawn in. Puffing it up stretches that drawing along the slopes into smears, so it lifts as a flat card.
  if (popout.pictureShowsDepth) return 0;
  const rim = Math.sqrt(1 - Math.pow(1 - Math.min(d, rimRadius) / rimRadius, 2));
  // No point rises higher than its distance from the outline. Otherwise a thin drawn tube turns into
  // a wall several times deeper than it is wide, and its stretched side reads as a second tube.
  return Math.min(rim * 9 + Math.sqrt(d / maximumInsideDistance) * 55, d);
};

const cutout = document.createElement("canvas"); cutout.width = boxW; cutout.height = boxH;
{
  const cutoutContext = cutout.getContext("2d", { willReadFrequently: true });
  const cutoutData = cutoutContext.createImageData(boxW, boxH);
  for (let y = 0; y < boxH; y++) for (let x = 0; x < boxW; x++) {
    const frameIndex = ((y + y0) * W + (x + x0)) * 4, cutoutIndex = (y * boxW + x) * 4;
    cutoutData.data[cutoutIndex] = pixels[frameIndex];
    cutoutData.data[cutoutIndex + 1] = pixels[frameIndex + 1];
    cutoutData.data[cutoutIndex + 2] = pixels[frameIndex + 2];
    cutoutData.data[cutoutIndex + 3] = subjectMask[y * boxW + x] ? 255 : 0;
  }
  cutoutContext.putImageData(cutoutData, 0, 0);
}
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(pageWidth, pageHeight);
document.body.insertBefore(renderer.domElement, document.getElementById("leaders"));
const scene = new THREE.Scene();
const fieldOfView = 35;
const camera = new THREE.PerspectiveCamera(fieldOfView, pageWidth / pageHeight, 1, 100000);
const halfFieldTangent = Math.tan(THREE.MathUtils.degToRad(fieldOfView / 2));
// At this distance one world unit is one page pixel on the z = 0 plane, so the frame starts exactly over the video.
const pageDistance = (pageHeight / 2) / halfFieldTangent;
const asTexture = (canvas) => { const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace; return texture; };

// The untouched frame stays flat in its exact place over the video while only the
// subject moves, so the subject comes up out of the video and the picture never warps.
const frameBackground = document.getElementById("frameBackground");
frameBackground.width = W; frameBackground.height = H;
Object.assign(frameBackground.style, { left: `${shownLeft}px`, top: `${shownTop}px`, width: `${shownWidth}px`, height: `${shownHeight}px` });
frameBackground.getContext("2d").drawImage(full, 0, 0);

const columns = 220, rows = Math.round(columns * boxH / boxW);
const vertexCount = columns * rows;
const positions = new Float32Array(vertexCount * 2 * 3), uvs = new Float32Array(vertexCount * 2 * 2);
const baseThickness = new Float32Array(vertexCount);
for (let row = 0; row < rows; row++) for (let column = 0; column < columns; column++) {
  const vertex = row * columns + column;
  const boxX = column / (columns - 1) * (boxW - 1), boxY = row / (rows - 1) * (boxH - 1);
  baseThickness[vertex] = thicknessInFramePixels(distance[Math.round(boxY) * boxW + Math.round(boxX)]) * frameToWorld;
  const worldPoint = framePointToWorld(x0 + boxX, y0 + boxY, 0);
  for (const side of [0, 1]) {
    const positionIndex = (side * vertexCount + vertex) * 3;
    positions[positionIndex] = worldPoint.x; positions[positionIndex + 1] = worldPoint.y;
    const uvIndex = (side * vertexCount + vertex) * 2;
    uvs[uvIndex] = boxX / (boxW - 1); uvs[uvIndex + 1] = 1 - boxY / (boxH - 1);
  }
}
const indices = [];
for (let row = 0; row < rows - 1; row++) for (let column = 0; column < columns - 1; column++) {
  const a = row * columns + column, b = a + 1, d = a + columns, e = d + 1;
  indices.push(a, d, b, b, d, e);
  indices.push(a + vertexCount, b + vertexCount, d + vertexCount, b + vertexCount, e + vertexCount, d + vertexCount);
}
const subjectGeometry = new THREE.BufferGeometry();
subjectGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
subjectGeometry.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
subjectGeometry.setIndex(indices);
const subjectMesh = new THREE.Mesh(subjectGeometry, new THREE.MeshStandardMaterial({ map: asTexture(cutout), alphaTest: 0.5, roughness: 0.75, side: THREE.DoubleSide }));
scene.add(subjectMesh);
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.6); keyLight.position.set(-2, 3, 4); scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.9); rimLight.position.set(2, -1, -4); scene.add(rimLight);

const maximumLift = 0.375 * shownHeight;
let liftNow = -1;
const applyLift = (amount) => {
  const position = subjectGeometry.attributes.position;
  for (let vertex = 0; vertex < vertexCount; vertex++) {
    const thickness = baseThickness[vertex] * amount;
    position.array[vertex * 3 + 2] = thickness;
    position.array[(vertex + vertexCount) * 3 + 2] = -thickness;
  }
  position.needsUpdate = true;
  subjectGeometry.computeVertexNormals();
  subjectMesh.position.z = maximumLift * amount;
  frameBackground.style.filter = `brightness(${1 - 0.25 * amount})`;
  document.getElementById("backdrop").style.opacity = String(0.55 * amount);
  liftNow = amount;
};
applyLift(0);

const subjectCenter = () => framePointToWorld((x0 + x1) / 2, (y0 + y1) / 2, maximumLift * liftNow);
const leaders = document.getElementById("leaders");
for (const part of popout.parts) {
  const element = document.createElement("div");
  element.className = "scene-label";
  element.textContent = part.isQuizAnswer ? "?" : part.label;
  if (part.isQuizAnswer) element.classList.add("quiz-answer", "unanswered");
  element.style.opacity = "0";
  document.body.appendChild(element);
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.setAttribute("stroke", "rgba(255, 255, 255, 0.85)");
  line.setAttribute("stroke-width", "1.5");
  leaders.appendChild(line);
  const boxX = Math.min(boxW - 1, Math.max(0, Math.round(part.x - x0))), boxY = Math.min(boxH - 1, Math.max(0, Math.round(part.y - y0)));
  labelEntries.push({ part, element, line, surface: thicknessInFramePixels(distance[boxY * boxW + boxX]) * frameToWorld });
}
const partPoint = (entry) => framePointToWorld(entry.part.x, entry.part.y, (maximumLift + entry.surface) * liftNow);

const subjectHeightWorld = boxH * frameToWorld;
const endDistance = (subjectHeightWorld / 0.62 / 2) / halfFieldTangent;
minimumDistance = endDistance * 0.4;
maximumDistance = endDistance * 1.8;
cameraDistance = pageDistance;
const target = new THREE.Vector3();
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const tourStartedAt = performance.now();

let dragging = false, lastX = 0, lastY = 0;
// A press that travels further than this many pixels is a drag to turn the model, not a click on a label.
const largestClickTravel = 4;
let pressStartX = 0, pressStartY = 0, pressTravel = 0, pressedLabelEntry = null;
// A drag sets the angle the camera heads for, and each frame eases the camera toward it.
// Drag events arrive unevenly (about 51 a second against 60 frames in Clicky's overlay),
// so snapping to each event left about 1 frame in 6 standing still.
let draggedYaw = 0, draggedPitch = 0;
// A flat card turned edge-on shows it is paper thin, so a picture that shows depth only tilts.
const largestDraggedYaw = popout.pictureShowsDepth ? 0.75 : Infinity;
const largestDraggedPitch = popout.pictureShowsDepth ? 0.45 : 1.1;
addEventListener("pointerdown", (event) => {
  dragging = true; lastX = event.clientX; lastY = event.clientY;
  pressStartX = event.clientX; pressStartY = event.clientY; pressTravel = 0;
  pressedLabelEntry = labelEntries.find((entry) => entry.element === event.target) ?? null;
});
addEventListener("pointerup", () => {
  dragging = false;
  const clickedLabelEntry = pressTravel <= largestClickTravel ? pressedLabelEntry : null;
  pressedLabelEntry = null;
  if (!clickedLabelEntry || !document.body.classList.contains("labels-take-clicks")) return;
  window.webkit?.messageHandlers?.liveSceneEvent?.postMessage("partTapped:" + clickedLabelEntry.part.label);
});
addEventListener("pointermove", (event) => {
  if (!dragging) return;
  pressTravel = Math.max(pressTravel, Math.hypot(event.clientX - pressStartX, event.clientY - pressStartY));
  if (!tourDone) return;
  draggedYaw = Math.min(largestDraggedYaw, Math.max(-largestDraggedYaw, draggedYaw - (event.clientX - lastX) * 0.008));
  draggedPitch = Math.min(largestDraggedPitch, Math.max(-largestDraggedPitch, draggedPitch + (event.clientY - lastY) * 0.005));
  lastX = event.clientX; lastY = event.clientY;
});

let lastFrameTime;

const finishTour = () => {
  draggedYaw = yaw; draggedPitch = pitch;
  restingCameraDistance = endDistance;
  tourDone = true;
  window.__tourFinished = true;
  // A quiz pop-out keeps its question, so only a pop-out with no quiz explains a clicked label.
  if (!popout.parts.some((part) => part.isQuizAnswer)) document.body.classList.add("labels-take-clicks");
  postLiveSceneEvent("tourFinished");
};

const render = (now) => {
  const seconds = (now - tourStartedAt) / 1000;
  const frameMilliseconds = lastFrameTime === undefined ? 0 : now - lastFrameTime;
  lastFrameTime = now;
  if (returnFrom) {
    const progress = Math.min(1, Math.max(0, (now - returnStartedAt) / 1000 / returnSeconds));
    const settle = ease(progress);
    const lift = returnFrom.lift * (1 - settle);
    if (lift !== liftNow) applyLift(lift);
    yaw = returnFrom.yaw * (1 - settle);
    pitch = returnFrom.pitch * (1 - settle);
    cameraDistance = returnFrom.cameraDistance + (pageDistance - returnFrom.cameraDistance) * settle;
    target.lerpVectors(returnFrom.target, new THREE.Vector3(0, 0, 0), settle);
    labelFade = 1 - Math.min(1, progress / 0.4);
    if (progress === 1 && !returnFinishedPosted) {
      returnFinishedPosted = true;
      postLiveSceneEvent("returnFinished");
    }
  } else if (!tourDone) {
    const lift = ease(Math.min(1, Math.max(0, (seconds - 1) / 2)));
    const move = ease(Math.min(1, Math.max(0, (seconds - 1.5) / 3)));
    if (lift !== liftNow) applyLift(lift);
    yaw = 0.6 * move;
    pitch = 0.18 * move;
    cameraDistance = pageDistance + (endDistance - pageDistance) * move;
    target.lerpVectors(new THREE.Vector3(0, 0, 0), subjectCenter(), move);
    if (seconds > 4.5) finishTour();
  } else {
    if (liftNow !== 1) applyLift(1);
    const easeToDrag = 1 - Math.exp(-frameMilliseconds / 50);
    yaw += (draggedYaw - yaw) * easeToDrag;
    pitch += (draggedPitch - pitch) * easeToDrag;
    cameraDistance += (restingCameraDistance - cameraDistance) * easeToDrag;
    const restingTarget = focusedEntry ? partPoint(focusedEntry) : subjectCenter();
    if (focusMove) {
      const progress = reducedMotionQuery.matches ? 1 : Math.min(1, (now - focusMove.startedAt) / 1500);
      if (!focusMove.from) focusMove.from = target.clone();
      target.lerpVectors(focusMove.from, restingTarget, ease(progress));
      if (progress === 1) focusMove = null;
    } else {
      target.copy(restingTarget);
    }
  }
  camera.position.set(
    target.x + cameraDistance * Math.sin(yaw) * Math.cos(pitch),
    target.y + cameraDistance * Math.sin(pitch),
    target.z + cameraDistance * Math.cos(yaw) * Math.cos(pitch),
  );
  camera.lookAt(target);
  // lookAt leaves the world matrix with the new position and the old rotation, and the labels
  // are projected before renderer.render refreshes it. Without this, labels shook while turning.
  camera.updateMatrixWorld();

  const labelFadeInAfterAnEarlyEnd = tourEndedEarlyAt === null ? 0 : (now - tourEndedEarlyAt) / 600;
  const labelOpacity = Math.min(1, Math.max(0, (seconds - 4) / 0.6, labelFadeInAfterAnEarlyEnd));
  const centerOnPage = subjectCenter().project(camera);
  const centerX = (centerOnPage.x + 1) / 2 * pageWidth, centerY = (1 - centerOnPage.y) / 2 * pageHeight;
  const reach = Math.min(pageWidth, pageHeight) * 0.14;
  // Labels go out to the left or right of the subject, so a tall narrow subject
  // gets two columns instead of one stack. Points near the middle alternate sides.
  const projectedPoints = labelEntries.map((entry) => {
    const projected = partPoint(entry).project(camera);
    return { entry, pointX: (projected.x + 1) / 2 * pageWidth, pointY: (1 - projected.y) / 2 * pageHeight };
  });
  const middleBand = Math.max(24, reach * 0.35);
  let nextMiddleSide = -1;
  const placements = projectedPoints
    .sort((first, second) => first.pointY - second.pointY)
    .map(({ entry, pointX, pointY }) => {
      const offsetFromCenter = pointX - centerX;
      // A label keeps its side until its part is clearly past the middle, so turning
      // the model does not flip it back and forth across the subject.
      if (entry.side === undefined) {
        entry.side = Math.sign(offsetFromCenter);
        if (Math.abs(offsetFromCenter) < middleBand) { entry.side = nextMiddleSide; nextMiddleSide = -nextMiddleSide; }
      } else if (Math.sign(offsetFromCenter) === -entry.side && Math.abs(offsetFromCenter) > middleBand) {
        entry.side = -entry.side;
      }
      const halfWidth = entry.element.offsetWidth / 2 + 4;
      return {
        entry, pointX, pointY,
        labelX: pointX + entry.side * (reach + halfWidth), labelY: pointY + (pointY - centerY) * 0.15,
        halfWidth, halfHeight: entry.element.offsetHeight / 2 + 3,
      };
    });
  // A label's center stays this far plus half its size inside the viewport, so none leaves the screen.
  const labelViewportMargin = 8;
  const keepLabelAxisInViewport = (position, halfSize, viewportSize) =>
    Math.min(viewportSize - labelViewportMargin - halfSize, Math.max(labelViewportMargin + halfSize, position));
  // Labels that land on each other are pushed apart, so none hides another.
  for (let pass = 0; pass < 12; pass++) {
    for (let first = 0; first < placements.length; first++) for (let second = first + 1; second < placements.length; second++) {
      const a = placements[first], b = placements[second];
      const overlapX = a.halfWidth + b.halfWidth - Math.abs(a.labelX - b.labelX);
      const overlapY = a.halfHeight + b.halfHeight - Math.abs(a.labelY - b.labelY);
      if (overlapX <= 0 || overlapY <= 0) continue;
      if (overlapY < overlapX) {
        const push = overlapY / 2 + 0.5, direction = a.labelY <= b.labelY ? -1 : 1;
        a.labelY += direction * push; b.labelY -= direction * push;
      } else {
        const push = overlapX / 2 + 0.5, direction = a.labelX <= b.labelX ? -1 : 1;
        a.labelX += direction * push; b.labelX -= direction * push;
      }
    }
    // Clamping inside each pass lets the next pass push labels apart again, instead of overlapping at an edge.
    for (const placement of placements) {
      placement.labelX = keepLabelAxisInViewport(placement.labelX, placement.halfWidth, pageWidth);
      placement.labelY = keepLabelAxisInViewport(placement.labelY, placement.halfHeight, pageHeight);
    }
  }
  // Each label follows its part exactly, and its offset from the part glides toward the new layout.
  // While the learner drags, the offsets hold still, so labels move with the model instead of
  // sliding around it. They glide to a freshly solved layout after the drag ends.
  const glide = 1 - Math.exp(-frameMilliseconds / 120);
  const offsetsHoldStill = dragging && tourDone;
  for (const placement of placements) {
    const { entry, pointX, pointY, halfWidth, halfHeight } = placement;
    if (entry.offsetX === undefined) { entry.offsetX = placement.labelX - pointX; entry.offsetY = placement.labelY - pointY; }
    if (!offsetsHoldStill) {
      entry.offsetX += (placement.labelX - pointX - entry.offsetX) * glide;
      entry.offsetY += (placement.labelY - pointY - entry.offsetY) * glide;
    }
    // Offsets held still during a drag, and the glide between layouts, can carry a label past the edge, so the final position is clamped too.
    const labelX = keepLabelAxisInViewport(pointX + entry.offsetX, halfWidth, pageWidth);
    const labelY = keepLabelAxisInViewport(pointY + entry.offsetY, halfHeight, pageHeight);
    entry.anchorX = pointX; entry.anchorY = pointY;
    // A transform keeps the label at sub-pixel positions like its SVG line. Left and top snap to
    // whole pixels in WebKit, which made labels shimmer against their lines.
    entry.element.style.transform = `translate(${labelX}px, ${labelY}px) translate(-50%, -50%)`;
    // While returning, every label fades from the opacity it had, including a focused or dimmed one.
    const shownOpacity = returnFrom ? entry.opacityAtReturn * labelFade : labelOpacity;
    if (returnFrom) entry.element.style.opacity = String(shownOpacity);
    else if (!entry.element.classList.contains("focused") && entry.element.style.opacity !== "0.35") entry.element.style.opacity = String(labelOpacity);
    entry.line.setAttribute("x1", pointX); entry.line.setAttribute("y1", pointY);
    entry.line.setAttribute("x2", labelX); entry.line.setAttribute("y2", labelY);
    entry.line.setAttribute("opacity", shownOpacity);
  }
  renderer.render(scene, camera);
  window.__ready = true;
  // The landed frame is the last one drawn.
  if (!returnFinishedPosted) requestAnimationFrame(render);
};
sceneIsBuilt = true;
// A clear that arrived while the page was still loading has nothing to draw.
if (returnStartedAt === null) requestAnimationFrame(render);
</script>
</body>
</html>
